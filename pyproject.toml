[project]
name = "football-prediction-engine"
version = "0.1.0"
description = "Advanced AI Football Probability Engine & Betting Analytics Platform"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    
    # Data collection
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.10",
    
    # Data processing
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    
    # ML
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    
    # Utilities
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "rich>=13.9",
]

[project.optional-dependencies]
ml = [
    "catboost>=1.2",
    "xgboost>=2.1",
    "optuna>=4.0",
    "shap>=0.46",
]
telegram = [
    "python-telegram-bot>=21.8",
]
sportybet = [
    "playwright>=1.48",
]
postgres = [
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
]
redis = [
    "redis>=5.2",
    "celery[redis]>=5.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["backend*"]
